#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    
    # Увеличиваем лимиты для длительных запросов
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # HTTP сервер (перенаправление на HTTPS)
    server {
        listen       80;
        server_name  neurotask.ru;
        return 301 https://$host$request_uri;
    }

    # HTTPS сервер
    server {
        listen       443 ssl;
        server_name  neurotask.ru;

        # Путь к сертификатам
        ssl_certificate      C:/cert/certificate.crt;
        ssl_certificate_key  C:/cert/certificate.key;
        
        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # API запросы с увеличенными таймаутами для ИИ
        location /api/ {
            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Передача cookies и заголовков для сессий
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
            
            # Увеличенные таймауты для длительных запросов к ИИ
            proxy_connect_timeout       300s;
            proxy_send_timeout          300s;
            proxy_read_timeout          300s;
            send_timeout                300s;
            
            # Буферизация для больших ответов
            proxy_buffering             on;
            proxy_buffer_size           128k;
            proxy_buffers               4 256k;
            proxy_busy_buffers_size     256k;
            
            # Отключение буферизации для streaming ответов (если используется)
            proxy_request_buffering     off;
        }

        # CSRF токены
        location /csrf-token {
            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Передача cookies и заголовков для сессий
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
            
            # Таймауты для CSRF (могут быть меньше)
            proxy_connect_timeout       30s;
            proxy_send_timeout          30s;
            proxy_read_timeout          30s;
        }

        # Health check
        location /health {
            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
            
            # Передача cookies и заголовков для сессий
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            # Короткие таймауты для health check
            proxy_connect_timeout       10s;
            proxy_send_timeout          10s;
            proxy_read_timeout          10s;
        }

        # =====================================================
        # НАЧАЛО: ДОБАВЛЕННЫЙ БЛОК ДЛЯ ЛЕНДИНГА
        # =====================================================

        # КРИТИЧЕСКИ ВАЖНО: Документы лендинга ПЕРВЫМИ (максимальный приоритет)
        # Должны быть обработаны до любых других правил
        location ^~ /docs/ {
            alias C:/nginx/html/landing/docs/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            
            # Логирование для отладки
            access_log C:/nginx/logs/docs-access.log;
            error_log C:/nginx/logs/docs-error.log;
        }

        # Дополнительная защита: обработка PDF файлов из лендинга
        location ~* ^/docs/.*\.pdf$ {
            alias C:/nginx/html/landing/docs/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # Обработка запроса /site (перенаправление на /site/)
        location = /site {
            return 301 /site/;
        }

        # Статические файлы лендинга (изображения, видео)
        location ^~ /site/img/ {
            alias C:/nginx/html/landing/img/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        location ^~ /site/videos/ {
            alias C:/nginx/html/landing/videos/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }


        # Обслуживание лендинга из папки /landing (с высоким приоритетом)
        location ^~ /site/ {
            alias C:/nginx/html/landing/;
            index index.html;
            try_files $uri $uri/ =404;
            
            # Кэширование HTML файлов лендинга
            location ~* \.html$ {
                expires 1h;
                add_header Cache-Control "public, must-revalidate";
            }
        }

        # =====================================================
        # КОНЕЦ: ДОБАВЛЕННЫЙ БЛОК ДЛЯ ЛЕНДИНГА
        # =====================================================

        # Статические файлы с кэшированием (для основного приложения)
        # ИСКЛЮЧАЕМ PDF файлы, чтобы они не перехватывались основным приложением
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            root C:/nginx/html/neurotask-frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # HTML файлы (без кэширования) (для основного приложения)
        location ~* \.html$ {
            root C:/nginx/html/neurotask-frontend;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Фронтенд (React приложение) - должно быть последним
        location / {
            root C:/nginx/html/neurotask-frontend;
            try_files $uri $uri/ /index.html;
            
            # Безопасность
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Обработка ошибок
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
