#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip сжатие
    gzip on;
    # ... (остальные настройки gzip)

    # HTTP сервер (перенаправление на HTTPS)
    server {
        listen       80;
        server_name  neurotask.ru;
        return 301 https://$host$request_uri;
    }

    # HTTPS сервер
    server {
        listen       443 ssl;
        server_name  neurotask.ru;

        # Путь к сертификатам
        ssl_certificate      C:/cert/certificate.crt;
        ssl_certificate_key  C:/cert/certificate.key;
        # ... (остальные настройки ssl)

        # API запросы
        location = /api {
            return 301 /api/;
        }
        
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / "/; HTTPOnly; Secure";
            
            proxy_connect_timeout       600s;
            proxy_send_timeout          600s;
            proxy_read_timeout          600s;
            send_timeout                600s;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_buffering off;
        }

        # CSRF токены
        location /csrf-token {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / "/; HTTPOnly; Secure";
        }

        # Health check
        location /health {
            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
        }

        # =====================================================
        # НАЧАЛО: ДОБАВЛЕННЫЙ БЛОК ДЛЯ ЛЕНДИНГА
        # =====================================================

        # Обработка запроса /site (перенаправление на /site/)
        location = /site {
            return 301 /site/;
        }

# Обслуживание лендинга из папки /landing (с высоким приоритетом)
location ^~ /site/ {
    alias C:/nginx/html/landing/;
    index index.html;
    try_files $uri $uri/ =404;
}

        # =====================================================
        # КОНЕЦ: ДОБАВЛЕННЫЙ БЛОК ДЛЯ ЛЕНДИНГА
        # =====================================================

        # Статические файлы с кэшированием (для основного приложения)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            root C:/nginx/html/neurotask-frontend;
            # ... (ваши настройки кеширования)
        }

        # HTML файлы (без кэширования) (для основного приложения)
        location ~* \.html$ {
            root C:/nginx/html/neurotask-frontend;
            # ... (ваши настройки кеширования)
        }

        # Фронтенд (React приложение) - должно быть последним
        location / {
            root C:/nginx/html/neurotask-frontend;
            try_files $uri $uri/ /index.html;
            # ... (ваши настройки безопасности)
        }

        # Обработка ошибок
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
