<!DOCTYPE html>
<html>
<head>
    <title>Test Production API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Тестирование Production API</h1>
    
    <div class="test-section">
        <h3>1. Проверка аутентификации</h3>
        <button onclick="checkAuth()">Проверить аутентификацию</button>
        <div id="auth-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2. Быстрый тест API</h3>
        <button onclick="quickTest()">Быстрый тест</button>
        <div id="quick-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3. Длительный тест (120 секунд)</h3>
        <button onclick="longTest()" id="long-btn">Длительный тест</button>
        <div id="long-result" class="result"></div>
        <div id="timer"></div>
    </div>

    <div class="test-section">
        <h3>4. Проверка cookies</h3>
        <button onclick="checkCookies()">Проверить cookies</button>
        <div id="cookies-result" class="result"></div>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;

        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.innerHTML = message;
            element.className = `result ${isError ? 'error' : 'success'}`;
        }

        async function checkAuth() {
            try {
                const response = await fetch('/api/test/quick-test', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('auth-result', `✅ Аутентификация OK: ${data.message}`);
                } else {
                    const data = await response.json();
                    log('auth-result', `❌ Ошибка аутентификации (${response.status}): ${data.message}`, true);
                }
            } catch (error) {
                log('auth-result', `❌ Ошибка сети: ${error.message}`, true);
            }
        }

        async function quickTest() {
            try {
                const response = await fetch('/api/test/quick-test', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log('quick-result', `✅ Быстрый тест OK: ${data.message}`);
                } else {
                    const data = await response.json();
                    log('quick-result', `❌ Ошибка (${response.status}): ${data.message}`, true);
                }
            } catch (error) {
                log('quick-result', `❌ Ошибка сети: ${error.message}`, true);
            }
        }

        async function longTest() {
            const btn = document.getElementById('long-btn');
            btn.disabled = true;
            btn.textContent = 'Выполняется...';
            
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            
            try {
                const response = await fetch('/api/test/long-request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        testData: 'Тестовый запрос на 120 секунд'
                    })
                });
                
                const duration = ((Date.now() - startTime) / 1000).toFixed(1);
                
                if (response.ok) {
                    const data = await response.json();
                    log('long-result', `✅ Длительный тест завершен за ${duration}с: ${data.message}`);
                } else {
                    const data = await response.json();
                    log('long-result', `❌ Ошибка (${response.status}) за ${duration}с: ${data.message}`, true);
                }
            } catch (error) {
                const duration = ((Date.now() - startTime) / 1000).toFixed(1);
                log('long-result', `❌ Ошибка сети за ${duration}с: ${error.message}`, true);
            } finally {
                clearInterval(timerInterval);
                btn.disabled = false;
                btn.textContent = 'Длительный тест';
                document.getElementById('timer').innerHTML = '';
            }
        }

        function updateTimer() {
            if (startTime) {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('timer').innerHTML = `⏱️ Прошло: ${elapsed}с из 120с`;
            }
        }

        function checkCookies() {
            const cookies = document.cookie;
            if (cookies) {
                log('cookies-result', `✅ Cookies найдены: ${cookies}`);
            } else {
                log('cookies-result', `❌ Cookies не найдены`, true);
            }
        }

        // Автоматическая проверка при загрузке
        window.onload = function() {
            checkCookies();
        };
    </script>
</body>
</html>
